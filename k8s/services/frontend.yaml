apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: istio-demo
  labels:
    app: frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: v1
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      containers:
        - name: frontend
          image: python:3.11-slim
          command: ["sh", "-c"]
          args:
            - |
              pip install fastapi uvicorn httpx --quiet &&
              cat > /app/main.py << 'PYEOF'
              import os, socket
              import httpx
              from fastapi import FastAPI, HTTPException
              from fastapi.responses import HTMLResponse
              app = FastAPI()
              VERSION = os.getenv("VERSION", "v1")
              HOSTNAME = socket.gethostname()
              BACKEND_URL = os.getenv("BACKEND_URL", "http://backend:8000")
              @app.get("/health")
              def health(): return {"status":"ok","service":"frontend","version":VERSION,"pod":HOSTNAME}
              @app.get("/api/products")
              def api():
                try:
                  r = httpx.get(f"{BACKEND_URL}/products", timeout=5.0); r.raise_for_status(); d = r.json()
                except Exception as e:
                  raise HTTPException(status_code=503, detail=str(e))
                d["frontend_pod"] = HOSTNAME; d["frontend_version"] = VERSION
                return d
              @app.get("/", response_class=HTMLResponse)
              def index():
                try:
                  r = httpx.get(f"{BACKEND_URL}/products", timeout=5.0); r.raise_for_status(); d = r.json()
                  products = d.get("products", []); error = None
                except Exception as e:
                  products = []; error = str(e); d = {}
                rows = ""
                for p in products:
                  sale = "🔥" if p.get("on_sale") else ""
                  rows += f"<tr><td>{p['id']}</td><td>{p['name']} {sale}</td><td>${p['price']}</td><td style='color:#4ade80'>${p['discounted_price']}</td><td>{p['stock']}</td></tr>"
                err = f"<div style='color:#f87171;padding:12px;background:#1a0000;border-radius:8px'>⚠️ {error}</div>" if error else ""
                return HTMLResponse(f"""<!DOCTYPE html><html><head><title>Istio Demo</title>
                <style>body{{font-family:system-ui;background:#0a0a0a;color:#ececec;padding:32px}}
                h1{{color:#60a5fa}}table{{border-collapse:collapse;width:100%;margin-top:16px}}
                th,td{{border:1px solid #333;padding:10px 14px;text-align:left}}
                th{{background:#1e1e1e;color:#93c5fd}}tr:hover{{background:#111}}
                code{{background:#1e1e1e;padding:2px 6px;border-radius:4px}}
                .chain{{background:#111;border:1px solid #222;border-radius:8px;padding:16px;margin:16px 0}}</style></head>
                <body><h1>🕸️ Istio Demo — Product Catalog</h1>{err}
                <div class="chain"><b>Call chain (Istio mTLS between every hop):</b>
                <p>🌐 <b>frontend</b>: <code>{HOSTNAME}</code> ({VERSION})</p>
                <p>⚙️ <b>backend</b>: <code>{d.get("backend_pod","?")}</code> ({d.get("backend_version","?")})</p>
                <p>🗄️ <b>database-svc</b>: <code>{d.get("db_pod","?")}</code> ({d.get("db_version","?")})</p></div>
                <table><tr><th>ID</th><th>Name</th><th>Price</th><th>Sale Price</th><th>Stock</th></tr>
                {rows or "<tr><td colspan='5' style='color:#555'>No data</td></tr>"}
                </table><p style="color:#555;font-size:12px;margin-top:24px">
                Refresh to see Istio load-balancing · <a href="/api/products" style="color:#60a5fa">JSON</a></p>
                </body></html>""")
              PYEOF
              mkdir -p /app && cd /app && uvicorn main:app --host 0.0.0.0 --port 8000
          env:
            - name: VERSION
              value: "v1"
            - name: BACKEND_URL
              value: "http://backend:8000"
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: istio-demo
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
