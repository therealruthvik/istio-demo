apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: istio-demo
  labels:
    app: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      version: v1
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
        - name: backend
          image: python:3.11-slim
          command: ["sh", "-c"]
          args:
            - |
              pip install fastapi uvicorn httpx --quiet &&
              cat > /app/main.py << 'PYEOF'
              import os, socket
              import httpx
              from fastapi import FastAPI, HTTPException
              app = FastAPI()
              VERSION = os.getenv("VERSION", "v1")
              HOSTNAME = socket.gethostname()
              DB_URL = os.getenv("DB_URL", "http://database-svc:8000")
              @app.get("/health")
              def health(): return {"status":"ok","service":"backend","version":VERSION,"pod":HOSTNAME}
              @app.get("/products")
              def products():
                try:
                  r = httpx.get(f"{DB_URL}/products", timeout=5.0); r.raise_for_status(); d = r.json()
                except Exception as e:
                  raise HTTPException(status_code=503, detail=str(e))
                for p in d.get("products", []):
                  p["discounted_price"] = round(p["price"]*0.9, 2)
                  p["on_sale"] = p["stock"] > 100
                return {"products":d.get("products",[]),"backend_pod":HOSTNAME,"backend_version":VERSION,"db_pod":d.get("served_by"),"db_version":d.get("version")}
              @app.get("/products/{pid}")
              def product(pid:int):
                try:
                  r = httpx.get(f"{DB_URL}/products/{pid}", timeout=5.0); r.raise_for_status(); d = r.json()
                except Exception as e:
                  raise HTTPException(status_code=503, detail=str(e))
                p = d.get("product",{})
                p["discounted_price"] = round(p.get("price",0)*0.9,2)
                return {"product":p,"backend_pod":HOSTNAME,"backend_version":VERSION,"db_pod":d.get("served_by")}
              PYEOF
              mkdir -p /app && cd /app && uvicorn main:app --host 0.0.0.0 --port 8000
          env:
            - name: VERSION
              value: "v1"
            - name: DB_URL
              value: "http://database-svc:8000"
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: istio-demo
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
