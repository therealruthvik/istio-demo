apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-svc
  namespace: istio-demo
  labels:
    app: database-svc
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: database-svc
      version: v1
  template:
    metadata:
      labels:
        app: database-svc
        version: v1        # Istio uses this label for DestinationRule subsets
    spec:
      containers:
        - name: database-svc
          image: python:3.11-slim
          command: ["sh", "-c"]
          args:
            - |
              pip install fastapi uvicorn httpx --quiet &&
              cat > /app/main.py << 'PYEOF'
              import os, socket, random
              from fastapi import FastAPI
              app = FastAPI()
              VERSION = os.getenv("VERSION", "v1")
              HOSTNAME = socket.gethostname()
              PRODUCTS = [
                {"id":1,"name":"Laptop Pro","price":1299.99,"stock":42},
                {"id":2,"name":"Wireless Mouse","price":29.99,"stock":150},
                {"id":3,"name":"Mechanical Keyboard","price":89.99,"stock":75},
                {"id":4,"name":"4K Monitor","price":449.99,"stock":30},
                {"id":5,"name":"USB-C Hub","price":49.99,"stock":200},
              ]
              @app.get("/health")
              def health(): return {"status":"ok","service":"database-svc","version":VERSION,"pod":HOSTNAME}
              @app.get("/products")
              def products(): return {"products":PRODUCTS,"served_by":HOSTNAME,"version":VERSION}
              @app.get("/products/{pid}")
              def product(pid:int):
                p=[x for x in PRODUCTS if x["id"]==pid]
                return {"product":p[0],"served_by":HOSTNAME,"version":VERSION} if p else {"error":"not found"}
              PYEOF
              mkdir -p /app && cd /app && uvicorn main:app --host 0.0.0.0 --port 8000
          env:
            - name: VERSION
              value: "v1"
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: database-svc
  namespace: istio-demo
  labels:
    app: database-svc
spec:
  selector:
    app: database-svc
  ports:
    - name: http
      port: 8000
      targetPort: 8000
